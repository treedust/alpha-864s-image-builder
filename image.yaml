# LattePanda Alpha 864s
# https://github.com/canonical/ubuntu-image/blob/main/internal/imagedefinition/README.rst
name: ubuntu-server-lattepanda-26
display-name: Ubuntu Server 26.04 LattePanda Alpha
revision: 1
architecture: amd64              # Keeping x86_64 for Intel Core CPU
kernel: linux-image-generic      # Uses the standard generic PC kernel
series: resolute                 # Ubuntu 26.04
class: preinstalled
customization:
  # Required dependency
  extra-snaps:
    - name: snapd
  extra-packages:
    # required for cloud-init key
    - name: cloud-init
    # required in setup_bootloader stage of ubuntu-image
    - name: grub-efi-amd64-bin
  cloud-init:
    user-data: ""
# Image Building
# Gadget snap
gadget:
  url: https://github.com/canonical/pc-gadget
  branch: classic
  type: git
# Root filesystem definition
rootfs:
  components:
    - main
    - restricted
    - universe
    - multiverse
  archive: ubuntu
  mirror: http://archive.ubuntu.com/ubuntu/
  pocket: updates
  seed:
    urls:
      - git://git.launchpad.net/~ubuntu-core-dev/ubuntu-seeds/+git/
    names:
      - server
      - minimal
    branch: resolute
    vcs: true
  sources-list-deb822: true
artifacts:
  img:
    - name: custom-lattepanda-alpha-864s-live.img
  manifest:
    name: custom-lattepanda-alpha-864s-live.manifest